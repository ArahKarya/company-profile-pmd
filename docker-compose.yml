services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_profile_pmd
      POSTGRES_USER: pmd_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pmd_secure_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmd_user -d company_profile_pmd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
